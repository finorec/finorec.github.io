<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulateur réseau</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Disposition : barre d'outils en haut, palette à gauche (bandeau sur mobile), canevas au centre, réglages en bas. */
  --ink:#1b2331; --muted:#566277; --chrome:#dfe3e9; --edge:#8d99ab; --panel:#c8ddf2;
  --canvas:#f1f4f8; --accent:#1d5fa6; --good:#14923a; --bad:#c62f27; --field:#ffffff;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--canvas);color:var(--ink);font:14px/1.35 var(--f-ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#cv,.dev,.pal,.tb{-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}
/* barre d'outils */
#toolbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#f4f6f9,#d3d8e0);border-bottom:1px solid var(--edge);overflow-x:auto;flex:none}
.tb{display:flex;align-items:center;gap:6px;min-height:42px;min-width:42px;padding:4px 10px;border:1px solid var(--edge);border-radius:6px;background:linear-gradient(#fff,#e3e8ee);cursor:pointer;white-space:nowrap;font-weight:500}
.tb:disabled{opacity:.45;cursor:default}
.tb[aria-pressed=true]{background:linear-gradient(#bcd5f2,#8db5e6);border-color:var(--accent)}
.tb svg{width:26px;height:26px;flex:none}
.sep{width:1px;align-self:stretch;background:var(--edge);margin:0 4px;flex:none}
.spacer{flex:1}
#speedbox{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
#speed{width:140px}
/* zone centrale */
#mid{flex:1;display:flex;min-height:0}
#palette{display:flex;flex-direction:column;width:136px;flex:none;overflow-y:auto;background:linear-gradient(90deg,#f2f4f7,#d2d7de);border-right:1px solid var(--edge)}
.pal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:0;background:none;cursor:pointer;font-weight:600;font-size:12.5px;text-align:center;color:var(--ink)}
.pal svg{width:54px;height:54px}
.pal[aria-pressed=true]{background:#bcd5f2;outline:2px solid var(--accent);outline-offset:-2px}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;background-color:var(--canvas);background-image:radial-gradient(circle,#a3aebf 1px,transparent 1.2px);background-size:24px 24px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:10px;top:10px;right:10px;max-width:520px;padding:6px 10px;background:rgba(255,255,255,.92);border:1px solid var(--edge);border-radius:6px;font-weight:500;pointer-events:none}
#hint:empty{display:none}
.dev{cursor:pointer}
.dev .ring{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;display:none}
.dev.sel .ring{display:block}
.dev.from .ring{display:block;stroke:var(--good)}
.dlabel{font:600 13px var(--f-ui);fill:var(--ink);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.lnk{stroke:#c0281f;stroke-width:3;stroke-linecap:round}
.lnk.sel{stroke:var(--accent);stroke-width:5}
.lnk.wifi{stroke:#4a6e9c;stroke-width:2;stroke-dasharray:2 6}
.lnk.hit{stroke:transparent;stroke-width:22;cursor:pointer}
.pkt{stroke:#fff;stroke-width:1.5}
.pkt.arp{fill:#e08a00}.pkt.icmp{fill:#14923a}.pkt.tcp{fill:#1d5fa6}.pkt.udp{fill:#8a3fc0}
.dot{fill:#22b04a;stroke:#fff;stroke-width:2}
/* panneau de réglages */
#pwrap{position:relative;flex:none}
#ptab{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:96px;height:18px;border:0;border-radius:7px 7px 0 0;background:#14171c;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
#ptab svg{width:12px;height:12px;transition:transform .15s}
#pwrap.collapsed #ptab svg{transform:rotate(180deg)}
#props{max-height:42vh;overflow:auto;background:linear-gradient(#cdd1d7,#eceef2);border-top:1px solid var(--edge)}
#pwrap.collapsed #props{display:none}
.pempty{padding:14px 16px;color:var(--muted)}
.pg{display:grid;grid-template-columns:minmax(250px,1fr) minmax(230px,1fr) minmax(230px,1fr);gap:6px 28px;padding:12px 16px;align-items:start}
.pg>div{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:132px 1fr;align-items:center;gap:6px}
.row>label,.lbl{font-weight:600}
.in{width:100%;min-height:36px;padding:4px 8px;border:1px solid var(--edge);background:var(--field);border-radius:2px}
.in:disabled,.in[readonly]{background:#e2e6ec;color:#788498}
.in.bad{border-color:var(--bad);outline:1px solid var(--bad)}
textarea.in{resize:vertical;min-height:90px;font-family:var(--f-mono);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;min-height:34px;font-weight:600}
.chk input{width:19px;height:19px;flex:none}
.chk.dis{color:#788498}
.btn{min-height:36px;padding:4px 14px;border:1px solid #7388a3;background:linear-gradient(#f5f9fd,#cbdbee);font-weight:600;border-radius:3px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{border-color:#127a30;background:linear-gradient(#bff0cc,#7fd197)}
.btn.stop{border-color:#9d231c;background:linear-gradient(#f7c9c5,#e49993)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.radios{display:flex;gap:16px;flex-wrap:wrap;font-weight:600;align-items:center;min-height:34px}
.radios label{display:flex;align-items:center;gap:6px}
.radios input{width:18px;height:18px}
.note{color:var(--muted);font-size:13px}
.status{font-weight:600;display:flex;align-items:center;gap:8px}
.status i{width:12px;height:12px;border-radius:50%;background:#aab3c1;display:inline-block}
.status.ok i{background:#22b04a}
/* onglets */
.tabbar{display:flex;gap:2px;padding:6px 8px 0;background:linear-gradient(#cdd1d7,#d9dce1);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;min-height:34px;border:1px solid var(--edge);border-bottom:0;border-radius:5px 5px 0 0;background:#e8eaee;cursor:pointer;font-weight:600;white-space:nowrap}
.tab svg{width:34px;height:22px}
.tab[aria-selected=true]{background:var(--panel)}
.tabbody{background:var(--panel);padding:12px 16px;min-height:120px}
.tabbody .col{max-width:520px;margin-left:auto;display:flex;flex-direction:column;gap:6px}
/* tableaux */
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{background:#ececee;border:1px solid #b4bcc8;padding:5px 6px;font-weight:600;text-align:center;position:sticky;top:0}
.tbl td{border:1px solid #d3d8e0;padding:2px 4px;min-height:30px}
.tbl tr.sel td{background:#b8d2ee}
.tbl tr.auto td{color:#8b93a1}
.tbl select.in{min-width:100px}
.tbl .cell{min-width:90px;width:100%;min-height:30px;border:0;background:transparent;padding:2px 4px}
.tbl .cell:focus{outline:2px solid var(--accent);outline-offset:-2px}
.tblwrap{overflow:auto;border:1px solid #b4bcc8;background:#fff;min-height:110px}
/* fenêtres */
#winlayer{position:fixed;inset:0;z-index:30;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(10,20,40,.38);pointer-events:auto}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:#efeff1;border:1px solid #6e7a8c;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.38);max-width:100vw;max-height:100%}
.wtitle{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;background:#f5f7fa;border-bottom:1px solid #c5ccd7;border-radius:8px 8px 0 0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wtitle svg{width:22px;height:22px;flex:none}
.wtitle b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx{border:0;background:none;font-size:24px;line-height:1;width:38px;height:36px;cursor:pointer;border-radius:4px}
.wx:hover{background:#e0524a;color:#fff}
.wbody{flex:1;min-height:0;overflow:auto;position:relative}
.dlg{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg .btns{justify-content:flex-end}
.tabbar.light{background:#e6e9ee}
.tabbar.light .tab[aria-selected=true]{background:#c8ddf2}
.tabpane{background:#c8ddf2;padding:14px 16px;min-height:200px}
/* bureau d'une machine */
.desk{display:flex;flex-direction:column;height:100%;min-height:0;background:#ececec}
.desk-main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.desk-home{flex:1;overflow:auto;background:linear-gradient(#0a2744,#0f7bd6);padding:14px}
.icons{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start}
.icon{width:104px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:0;background:none;color:#fff;font-weight:700;font-size:13px;text-align:center;cursor:pointer;border-radius:6px}
.icon:hover,.icon:focus-visible{background:rgba(255,255,255,.16)}
.icon svg{width:62px;height:62px}
.apptitle{display:flex;align-items:center;justify-content:center;gap:8px;background:#3b3b3d;color:#e6e6e6;font-weight:600;padding:6px 10px}
.apptitle svg{width:22px;height:22px}
.appbody{flex:1;min-height:0;overflow:auto;background:#eeeeee;position:relative}
.deskbar{display:flex;align-items:center;background:#b2b2b4;border-top:1px solid #8b8b8d}
.deskbar button{flex:1;min-height:40px;border:0;background:#bdbdc0;font-weight:700;cursor:pointer}
.deskbar button:hover{background:#cfcfd2}
.apad{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.cols{display:flex;gap:14px;align-items:stretch}
.cols>.grow{flex:1;min-width:0}
.swlist{border:1px solid #7f8ba0;background:#fff;height:min(46vh,300px);overflow:auto;padding:4px}
.swlist div{padding:5px 6px;font-weight:600;cursor:pointer;border-radius:2px}
.swlist div.sel{background:#8fb3dc}
.arrows{display:flex;flex-direction:column;justify-content:center;gap:14px}
.arrows .btn{min-width:46px;min-height:46px;font-size:20px;padding:0}
.term{background:#0f1720;color:#d7e3f2;font-family:var(--f-mono);font-size:13px;height:100%;display:flex;flex-direction:column}
.term pre{margin:0;padding:10px;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-word;font:inherit}
.term .line{display:flex;align-items:center;border-top:1px solid #243246;padding-left:10px;color:#8fe3a2}
.term input{flex:1;background:transparent;border:0;color:#d7e3f2;padding:11px 8px;font:inherit;outline:none;min-width:0}
.logbox{background:#fff;border:1px solid #7f8ba0;font-family:var(--f-mono);font-size:13px;padding:6px 8px;overflow:auto;min-height:120px;flex:1;white-space:pre-wrap;word-break:break-word}
.browserframe{flex:1;border:1px solid #7f8ba0;background:#fff;min-height:200px;width:100%}
.inline{display:flex;gap:8px;align-items:center}
.inline .in{flex:1;min-width:0}
.mail{border:1px solid #9aa5b6;background:#fff;max-height:180px;overflow:auto}
.mail div{padding:6px 8px;border-bottom:1px solid #e2e6ec;cursor:pointer}
.mail div:hover{background:#eaf2fb}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;padding:10px 16px;background:#1b2331;color:#fff;border-radius:8px;font-weight:500;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
:focus-visible{outline:3px solid #f2a900;outline-offset:1px}
@media (prefers-reduced-motion:reduce){#toast,#ptab svg{transition:none}}
@media (max-width:720px){
  #mid{flex-direction:column}
  #palette{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--edge)}
  .pal{min-width:80px;flex:0 0 auto;padding:4px 2px;font-size:11.5px}
  .pal svg{width:38px;height:38px}
  .tb .lbl{display:none}
  #speed{width:96px}
  .pg{grid-template-columns:1fr;padding:10px 12px}
  .row{grid-template-columns:112px 1fr}
  #props{max-height:46vh}
  .win.big{left:6px!important;top:6px!important;width:calc(100% - 12px)!important;height:calc(100% - 12px)!important}
  .cols{flex-direction:column}
  .tabbody .col{max-width:none}
}
</style>
</head>

<script>
'use strict';
/* ===== Outils généraux ===== */
const $ = (s, r = document) => r.querySelector(s);
const BCAST = 'FF:FF:FF:FF:FF:FF';

function h(tag, attrs, ...kids) {
  const svg = tag.startsWith('svg:');
  const el = svg ? document.createElementNS('http://www.w3.org/2000/svg', tag.slice(4)) : document.createElement(tag);
  let value;
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'readOnly') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  if (value !== undefined) el.value = value;
  return el;
}
const icon = (id, cls) => h('svg', { class: cls, 'aria-hidden': 'true' }, h('svg:use', { href: '#' + id }));
/* h() crée des éléments HTML : l'icône SVG est donc construite avec le bon espace de noms */
function svgIcon(id, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  if (cls) s.setAttribute('class', cls);
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#' + id);
  s.append(u);
  return s;
}

/* ===== Adresses ===== */
const ipRe = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
const isIp = s => ipRe.test(String(s == null ? '' : s).trim());
const ip2n = s => String(s).trim().split('.').reduce((a, b) => a * 256 + (+b), 0) >>> 0;
const n2ip = n => [24, 16, 8, 0].map(sh => (n >>> sh) & 255).join('.');
const netOf = (ip, mask) => (ip2n(ip) & ip2n(mask)) >>> 0;
const sameNet = (a, b, mask) => isIp(a) && isIp(b) && isIp(mask) && netOf(a, mask) === netOf(b, mask);
const popcount = n => { let c = 0; n = n >>> 0; while (n) { c += n & 1; n >>>= 1; } return c; };
const macRe = /^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/;
function genMac() {
  for (;;) {
    const b = Array.from({ length: 6 }, () => Math.floor(Math.random() * 256));
    b[0] = (b[0] & 0xFC) | 0x02;
    const m = b.map(x => x.toString(16).padStart(2, '0').toUpperCase()).join(':');
    if (!S.devices.some(d => d.ifs && d.ifs.some(i => i.mac === m))) return m;
  }
}
const hex6 = () => Array.from({ length: 6 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
const hhmmss = t => new Date(t).toLocaleTimeString('fr-FR');

/* ===== État ===== */
const S = {
  devices: [], links: [], nextId: 1,
  sel: null,            // {kind:'dev'|'link', id}
  mode: 'design',       // 'design' | 'sim'
  tool: null,           // null | 'cable' | type d'appareil à poser
  cableFrom: null,
  view: { x: 0, y: 0, k: 1 },
  tabIdx: {}
};
const dev = id => S.devices.find(d => d.id === id);
const TYPES = {
  computer:   { label: 'Ordinateur',         ico: 'computer' },
  laptop:     { label: 'Portable',           ico: 'laptop' },
  switch:     { label: 'Switch / Wi-Fi',     ico: 'switch' },
  homerouter: { label: 'Routeur Domestique', ico: 'homerouter' },
  router:     { label: 'Routeur',            ico: 'router' },
  modem:      { label: 'Modem',              ico: 'modem' }
};
const isHost = d => d.type === 'computer' || d.type === 'laptop';

/* ===== Valeurs par défaut ===== */
const newFirewall = () => ({ active: false, icmp: false, synOnly: true, def: 'rejeter', rules: [] });
const newDhcp = () => ({ enabled: false, start: '0.0.0.0', end: '0.0.0.0', manual: false, gw: '0.0.0.0', dns: '0.0.0.0', statics: [] });
const uniqName = base => {
  const names = S.devices.map(d => d.name);
  if (!names.includes(base)) return base;
  let n = 2; while (names.includes(base + ' ' + n)) n++;
  return base + ' ' + n;
};
function newDevice(type, x, y, nics) {
  const d = { id: S.nextId++, type, name: uniqName(TYPES[type].label), x, y };
  const mk = () => ({ ip: '192.168.0.10', mask: '255.255.255.0', mac: genMac() });
  if (isHost(d)) {
    d.ifs = [mk()];
    Object.assign(d, {
      gw: '', dns: '', wifi: false, ssid: '', dhcpClient: false, routing: false, nameMode: 'name',
      dhcp: newDhcp(), apps: [], fs: [], firewall: newFirewall(), dnsRecords: [],
      web: { port: 80, pages: [{ path: '/', html: '<h1>Bienvenue</h1>\n<p>Page d’accueil de ce serveur web.</p>' }] },
      mailSrv: { domain: 'exemple.fr', users: [] },
      mailCli: { user: '', pass: '', server: '' },
      gen: { sport: 12345, sproto: 'TCP', chost: '', cport: 12345, cproto: 'TCP' },
      p2p: { port: 6346 }
    });
  } else if (type === 'switch') {
    Object.assign(d, { ssid: hex6(), retention: 300, cloud: false });
  } else if (type === 'homerouter') {
    d.ifs = [mk(), { ip: '42.0.0.10', mask: '255.0.0.0', mac: genMac(), dhcp: false }];
    Object.assign(d, { gw: '', dhcp: newDhcp(), firewall: newFirewall(), forwards: [] });
  } else if (type === 'router') {
    d.ifs = Array.from({ length: nics || 2 }, mk);
    Object.assign(d, { gw: '', auto: false, routes: [], firewall: newFirewall() });
  } else if (type === 'modem') {
    d.ifs = [{ mac: genMac() }];
    Object.assign(d, { listen: false, host: 'localhost', port: 12345 });
  }
  S.devices.push(d);
  return d;
}

/* ===== Liens ===== */
const linkAt = (id, port) => S.links.find(l => (l.a === id && l.ap === port) || (l.b === id && l.bp === port));
const linksOf = id => S.links.filter(l => l.a === id || l.b === id);
const SWITCH_PORTS = 24;
function portCount(d) {
  if (d.type === 'switch') return SWITCH_PORTS;
  if (d.type === 'homerouter') return 2;
  if (d.ifs) return d.ifs.length;
  return 1;
}
function freePort(d, other) {
  const n = portCount(d);
  const free = i => !linkAt(d.id, i);
  if (d.type === 'homerouter') {
    const wanFirst = ['modem', 'router', 'homerouter'].includes(other.type);
    const order = wanFirst ? [1, 0] : [0, 1];
    for (const i of order) if (free(i)) return i;
    return null;
  }
  for (let i = 0; i < n; i++) if (free(i)) return i;
  return null;
}
function connectDevices(a, b) {
  if (a === b) return 'Un appareil ne peut pas être relié à lui-même.';
  const A = dev(a), B = dev(b);
  for (const X of [A, B]) if (isHost(X) && X.wifi) return X.name + ' est en mode Wi-Fi : repassez-le en mode filaire pour y brancher un câble.';
  const pa = freePort(A, B), pb = freePort(B, A);
  if (pa == null) return 'Aucune interface libre sur ' + A.name + '.';
  if (pb == null) return 'Aucune interface libre sur ' + B.name + '.';
  S.links.push({ id: S.nextId++, a, ap: pa, b, bp: pb });
  return null;
}
function removeLink(id) { S.links = S.links.filter(l => l.id !== id); }
function removeDevice(id) {
  S.links = S.links.filter(l => l.a !== id && l.b !== id);
  S.devices = S.devices.filter(d => d.id !== id);
}
function remoteOf(d, port) {
  const l = linkAt(d.id, port);
  if (!l) return null;
  return l.a === d.id && l.ap === port ? dev(l.b) : dev(l.a);
}
function swapPorts(d, p, q) {
  const lp = linkAt(d.id, p), lq = linkAt(d.id, q);
  const set = (l, from, to) => { if (!l) return; if (l.a === d.id && l.ap === from) l.ap = to; else if (l.b === d.id && l.bp === from) l.bp = to; };
  set(lp, p, q); set(lq, q, p);
}
function setNicCount(d, n) {
  n = Math.max(1, Math.min(8, n));
  while (d.ifs.length < n) d.ifs.push({ ip: '192.168.0.10', mask: '255.255.255.0', mac: genMac() });
  while (d.ifs.length > n) {
    const i = d.ifs.length - 1;
    const l = linkAt(d.id, i); if (l) removeLink(l.id);
    d.ifs.pop();
  }
}

/* ===== Sauvegarde ===== */
function serialize() {
  return JSON.stringify({ v: 1, devices: S.devices, links: S.links, nextId: S.nextId, view: S.view }, (k, v) => k === 'rt' ? undefined : v);
}
function loadState(txt) {
  const o = typeof txt === 'string' ? JSON.parse(txt) : txt;
  if (!o || !Array.isArray(o.devices) || !Array.isArray(o.links)) throw new Error('Fichier non reconnu.');
  for (const d of o.devices) {
    if (!TYPES[d.type] || typeof d.id !== 'number') throw new Error('Appareil invalide dans le fichier.');
  }
  S.devices = o.devices; S.links = o.links; S.nextId = o.nextId || (Math.max(0, ...o.devices.map(d => d.id), ...o.links.map(l => l.id)) + 1);
  S.view = o.view || { x: 0, y: 0, k: 1 };
  S.sel = null; S.tool = null; S.cableFrom = null; S.tabIdx = {};
}
let saveTimer = 0;
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem('simulateur-reseau-v1', serialize()); } catch (e) { /* stockage indisponible */ } }, 400);
}
function loadEmpty() {
  S.devices = []; S.links = []; S.nextId = 1; S.sel = null; S.tool = null; S.cableFrom = null; S.tabIdx = {};
  S.view = { x: 0, y: 0, k: 1 };
}
/* ===== Moteur de simulation ===== */
const Sim = { on: false, epoch: 0, speed: 55, timers: new Set(), pid: 1, notify: () => {} };
const D = () => 60 * Math.pow(2000 / 60, 1 - Sim.speed / 100);        // durée d'un saut (ms)
const tmo = () => Math.max(2600, D() * 30);                              // délai d'attente
function later(ms, fn) {
  const ep = Sim.epoch;
  const t = setTimeout(() => { Sim.timers.delete(t); if (Sim.on && ep === Sim.epoch) fn(); }, ms);
  Sim.timers.add(t);
  return t;
}
function cancel(t) { clearTimeout(t); Sim.timers.delete(t); }

/* --- animation des paquets --- */
const anims = []; let raf = 0;
function animate(a, b, kind) {
  const el = h('svg:circle', { r: 6, class: 'pkt ' + kind, cx: a.x, cy: a.y });
  $('#packets').append(el);
  anims.push({ el, a: { x: a.x, y: a.y }, b: { x: b.x, y: b.y }, t0: performance.now(), dur: D() });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(now) {
  raf = 0;
  for (let i = anims.length - 1; i >= 0; i--) {
    const p = anims[i], k = Math.max(0, Math.min(1, (now - p.t0) / p.dur));
    p.el.setAttribute('cx', p.a.x + (p.b.x - p.a.x) * k);
    p.el.setAttribute('cy', p.a.y + (p.b.y - p.a.y) * k);
    if (k >= 1) { p.el.remove(); anims.splice(i, 1); }
  }
  if (anims.length) raf = requestAnimationFrame(tick);
}
function clearAnims() { anims.splice(0).forEach(p => p.el.remove()); }

/* --- exécution --- */
const newRt = () => ({ arp: {}, pend: {}, pings: {}, sat: {}, nat: [], natPort: 49152, leases: {}, lease: null,
  udp: {}, tcpL: {}, conns: {}, eph: 49151, srv: {}, ui: {}, auto: [], peer: null, listening: false });

function startSim() {
  Sim.on = true; Sim.epoch++;
  S.devices.forEach(d => { d.rt = newRt(); });
  computeAuto();
  S.devices.filter(d => d.type === 'modem').forEach(modemApply);
  let k = 0;
  S.devices.forEach(d => {
    if (isHost(d) && d.dhcpClient) dhcpStart(d, 0, k++);
    if (d.type === 'homerouter' && d.ifs[1].dhcp) dhcpStart(d, 1, k++);
  });
}
function stopSim() {
  S.devices.filter(d => d.type === 'modem').forEach(modemShutdown);
  Sim.on = false; Sim.epoch++;
  Sim.timers.forEach(clearTimeout); Sim.timers.clear();
  clearAnims();
  S.devices.forEach(d => { delete d.rt; });
}

/* --- configuration effective --- */
function ifc(d, i = 0) {
  const f = d.ifs[i];
  const l = d.rt && d.rt.lease;
  if ((isHost(d) && d.dhcpClient) || (d.type === 'homerouter' && i === 1 && f.dhcp)) {
    return { ip: l ? l.ip : '0.0.0.0', mask: l ? l.mask : '0.0.0.0', mac: f.mac };
  }
  return f;
}
function leaseActive(d) { return (isHost(d) && d.dhcpClient) || (d.type === 'homerouter' && d.ifs[1].dhcp); }
function gwOf(d) { const l = d.rt && d.rt.lease; return (l && leaseActive(d) && isIp(l.gw) && l.gw !== '0.0.0.0') ? l.gw : d.gw; }
function dnsOf(d) { const l = d.rt && d.rt.lease; return (l && leaseActive(d) && isIp(l.dns) && l.dns !== '0.0.0.0') ? l.dns : d.dns; }

/* --- envoi et réception de trames --- */
const kindOf = f => f.type === 'arp' ? 'arp' : ((f.pkt && f.pkt.proto) || 'udp');
function peerOf(d, port) {
  if (d.type === 'switch' && typeof port === 'string') {
    const c = dev(+port.slice(2)); return c ? { dev: c, port: 0 } : null;
  }
  if (isHost(d) && d.wifi) {
    const ap = apFor(d); return ap ? { dev: ap, port: 'w:' + d.id } : null;
  }

    if (!d) return;

/* ===== Import d'un fichier Filius (.fls) ===== */
async function unzipFirst(buf, wanted) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('ce n’est pas une archive Filius.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) {
    const meth = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    if (name.endsWith(wanted)) {
      const lnl = dv.getUint16(off + 26, true), lxl = dv.getUint16(off + 28, true);
      const data = u8.subarray(off + 30 + lnl + lxl, off + 30 + lnl + lxl + csize);
      if (meth === 0) return new TextDecoder().decode(data);
      if (meth !== 8) throw new Error('compression non gérée.');
      const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new TextDecoder().decode(await new Response(ds).arrayBuffer());
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error('konfiguration.xml introuvable dans l’archive.');
}
function fitView() {
  if (!S.devices.length) { S.view = { x: 0, y: 0, k: 1 }; return; }
  const r = stage.getBoundingClientRect(), pad = 70;
  const xs = S.devices.map(d => d.x), ys = S.devices.map(d => d.y);
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad + 20;
  const k = Math.max(0.3, Math.min(1, r.width / (x1 - x0), r.height / (y1 - y0)));

      const cls = node.getAttribute('class') || '', icon = (label.querySelector('string') || {}).textContent || '';

      else if (/Switch/i.test(cls)) type = 'switch';
      else if (/Modem/i.test(cls)) type = 'modem';
      else if (/Vermittlung|Router/i.test(cls) && /Gateway|Domestic|Heim/i.test(cls + icon + typTxt)) type = 'homerouter';
      else if (/Gateway/i.test(cls)) type = 'homerouter';
      else if (/Vermittlung/i.test(cls)) type = 'router';

      if (!type) { warn.push(typTxt || cls); continue; }

      }

      const id1 = z1 && z1.querySelector('object').getAttribute('idref'), id2 = z2 && z2.querySelector('object').getAttribute('idref');

function appCmd(d, body) {
  const out = h('pre');
  const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Commande' });
  body.append(h('div', { class: 'term' }, out, h('div', { class: 'line' }, '>', inp)));
  const api = { print: s => { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; }, clear: () => { out.textContent = ''; } };
  const hist = []; let hi = 0, busy = false;
  api.print('Ligne de commande de ' + d.name + '\nTapez « help » pour la liste des commandes.\n');
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) { hi = Math.max(0, hi - 1); inp.value = hist[hi]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; e.preventDefault(); }
    else if (e.key === 'Enter' && !busy) {
      const line = inp.value; inp.value = '';
      api.print('> ' + line);
      if (line.trim()) { hist.push(line); hi = hist.length; }
      busy = true; inp.disabled = true;
      runCmd(d, line, api, () => { busy = false; inp.disabled = false; inp.focus(); });
    }
  });
  setTimeout(() => inp.focus(), 50);
}
function runCmd(d, line, api, done) {
  const parts = line.trim().split(/\s+/), c = (parts[0] || '').toLowerCase(), args = parts.slice(1);
  const P = api.print;
  switch (c) {
    case '': return done();
    case 'help':
      P('Commandes disponibles :\n  ipconfig            adresse IP, masque, passerelle, DNS, MAC\n  ping <hôte>         envoie 4 demandes d’écho ICMP\n  traceroute <hôte>   affiche les routeurs traversés (aussi : tracert)\n  arp                 table ARP de la machine\n  host <nom>          résolution DNS (aussi : nslookup)\n  hostname            nom de la machine\n  dir                 liste des fichiers (aussi : ls)\n  cat <fichier>       affiche un fichier (aussi : type)\n  echo <texte> [> fichier]\n  rm <fichier>        supprime un fichier (aussi : del)\n  clear               efface l’écran (aussi : cls)');
      return done();
    case 'clear': case 'cls': api.clear(); return done();
    case 'hostname': P(d.name); return done();
    case 'ipconfig': {
      const c0 = ifc(d, 0);
      P('Adresse IP    : ' + c0.ip + '\nMasque        : ' + c0.mask + '\nPasserelle    : ' + (gwOf(d) || '(aucune)') + '\nServeur DNS   : ' + (dnsOf(d) || '(aucun)') + '\nAdresse MAC   : ' + c0.mac + '\nMode          : ' + (d.wifi ? 'Wi-Fi (' + (d.ssid || 'aucun réseau') + ')' : 'filaire'));
      return done();
    }
    case 'arp': {
      const e = Object.entries(d.rt.arp);
      P(e.length ? e.map(([ip, mac]) => ip.padEnd(16) + mac).join('\n') : 'La table ARP est vide.');
      return done();
    }
    case 'host': case 'nslookup':
      if (!args[0]) { P('Utilisation : host <nom>'); return done(); }
      resolveName(d, args[0], (ip, err) => { P(ip ? args[0] + ' a pour adresse ' + ip : err); done(); });
      return;
    case 'dir': case 'ls':
      P(d.fs.length ? d.fs.map(f => f.name.padEnd(28) + (isImg(f) ? 'image' : 'texte') + '  ' + String(f.content).length + ' o').join('\n') : 'Aucun fichier.');
      return done();
    case 'cat': case 'type': {
      const f = fsGet(d, args[0]);
      P(!args[0] ? 'Utilisation : cat <fichier>' : !f ? 'Fichier introuvable : ' + args[0] : isImg(f) ? '(fichier image)' : f.content);
      return done();
    }
    case 'rm': case 'del': {
      const i = d.fs.findIndex(f => f.name === args[0]);
      if (i < 0) P('Fichier introuvable : ' + (args[0] || '')); else { d.fs.splice(i, 1); saveSoon(); P('Fichier supprimé.'); }
      return done();
    }
    case 'echo': {
      const rest = line.trim().slice(parts[0].length).trim(), k = rest.lastIndexOf('>');
      if (k >= 0) { const name = rest.slice(k + 1).trim(), txt = rest.slice(0, k).trim(); if (name) { fsPut(d, name, txt); P('Écrit dans ' + name); } else P('Nom de fichier manquant.'); }
      else P(rest);
      return done();
    }
    case 'ping': return cmdPing(d, args[0], api, done);
    case 'traceroute': case 'tracert': return cmdTrace(d, args[0], api, done);
    default: P('Commande inconnue : ' + c + '. Tapez « help ».'); return done();
  }
}
const pingMs = ms => Math.max(1, Math.round(ms / D() * 0.4));
function cmdPing(d, target, api, done) {
  const P = api.print;
  if (!target) { P('Utilisation : ping <adresse IP ou nom>'); return done(); }
  resolveName(d, target, (ip, err) => {
    if (!ip) { P(err || 'Résolution impossible.'); return done(); }
    P('PING ' + target + (target !== ip ? ' [' + ip + ']' : '') + ' : 32 octets de données');
    let sent = 0, ok = 0;
    const next = () => {
      if (sent >= 4) { P('\n--- statistiques ping pour ' + ip + ' ---\n' + sent + ' paquets émis, ' + ok + ' reçus, ' + Math.round((sent - ok) / sent * 100) + '% perdus'); return done(); }
      sent++;
      sendEcho(d, ip, 64, (pkt, ms) => {
        if (pkt.type === 'noroute') { P('Impossible de joindre l’hôte de destination (aucune route ou adresse IP non configurée).'); return done(); }
        if (pkt.type === 'echo-rep') { ok++; P('Réponse de ' + pkt.src + ' : octets=32 temps=' + pingMs(ms) + ' ms TTL=' + pkt.ttl); }
        else if (pkt.type === 'timeout') P('Délai d’attente de la demande dépassé.');
        else if (pkt.type === 'ttl') P('Réponse de ' + pkt.src + ' : durée de vie dépassée en transit.');
        else P('Réponse de ' + pkt.src + ' : destination inaccessible.');
        later(Math.min(500, D() * 2), next);
      });
    };
    next();
  });
}
function cmdTrace(d, target, api, done) {
  const P = api.print;
  if (!target) { P('Utilisation : traceroute <adresse IP ou nom>'); return done(); }
  resolveName(d, target, (ip, err) => {
    if (!ip) { P(err || 'Résolution impossible.'); return done(); }
    P('Détermination de l’itinéraire vers ' + ip + ' (30 sauts maximum) :');
    let ttl = 1, lost = 0;
    const step = () => {
      if (ttl > 30) { P('Nombre maximal de sauts atteint.'); return done(); }
      sendEcho(d, ip, ttl, (pkt, ms) => {
        const n = String(ttl).padStart(2, ' ');
        if (pkt.type === 'ttl') { lost = 0; P(n + '  ' + pkt.src + '  (' + pingMs(ms) + ' ms)'); ttl++; later(60, step); }
        else if (pkt.type === 'echo-rep') { P(n + '  ' + pkt.src + '  (' + pingMs(ms) + ' ms)\nItinéraire terminé.'); done(); }
        else if (pkt.type === 'unreach') { P(n + '  ' + pkt.src + '  destination inaccessible'); done(); }
        else if (pkt.type === 'noroute') { P('Impossible de joindre l’hôte de destination.'); done(); }
        else { P(n + '  *  délai dépassé'); ttl++; if (++lost >= 3) { P('Abandon : plus aucune réponse.'); done(); } else later(60, step); }
      });
    };
    step();
  });
}

function readImport(file, d, cb) {
  const img = /^image\//.test(file.type) || /\.(png|jpe?g|gif|svg|webp)$/i.test(file.name);
  if (file.size > (img ? 1e6 : 2e5)) return toast('Fichier trop volumineux (max. ' + (img ? '1 Mo' : '200 Ko') + ').');
  const r = new FileReader();
  r.onload = () => { fsPut(d, file.name, String(r.result), img ? 'image' : 'text'); cb(); };
  if (img) r.readAsDataURL(file); else r.readAsText(file);
}

  const peerIp = h('input', { class: 'in', placeholder: 'Adresse IP d’un voisin', 'aria-label': 'Adresse IP du voisin' });

    hits.textContent = '';
    st.hits.forEach(x => hits.append(h('div', { onclick: () => download(x) }, x.name + ' — ' + x.ip + ' (toucher pour télécharger)')));
    if (!st.hits.length) hits.append(h('div', { style: { color: '#666', cursor: 'default' } }, 'Aucun résultat.'));
  };
  const download = x => {
    tcpConnect(d, x.ip, x.port, (c, e) => {
      if (!c) return toast('Téléchargement impossible : ' + e);
      c.onData = raw => { try { const m = JSON.parse(raw); if (m.t === 'file') { fsPut(d, m.name, m.content, m.kind); toast('Fichier reçu : ' + m.name); slog(d, 'p2p', 'Téléchargé : ' + m.name); } else toast('Fichier introuvable chez le voisin.'); } catch (er) { /* ignoré */ } };
      c.send(JSON.stringify({ t: 'get', name: x.name }));
    });
  };
  const logB = logView(d, 'p2p');
  d.rt.ui.p2p = () => { logB.textContent = srvState(d, 'p2p').log.join('\n'); logB.scrollTop = logB.scrollHeight; drawHits(); };
  drawHits();
  body.append(apad(
    h('div', { class: 'inline' }, h('label', { class: 'lbl' }, 'Port'), textIn(g, 'port', { num: true, min: 1, label: 'Port' }), ss.b),
    h('div', { class: 'inline' }, peerIp, btn('Connecter un voisin', () => {
      if (!st.running) return toast('Démarrez d’abord le nœud.');
      if (!isIp(peerIp.value)) return toast('Adresse IP invalide.');
      tcpConnect(d, peerIp.value.trim(), +g.port, (c, e) => { if (!c) return toast('Connexion impossible : ' + e); addPeer(c); slog(d, 'p2p', 'Connecté au voisin ' + c.rip); });
    })),
    h('div', { class: 'note' }, 'Les fichiers de cette machine (explorateur) sont partagés avec les voisins. La recherche est relayée de voisin en voisin (5 sauts maximum).'),
    h('div', { class: 'inline' }, q, btn('Rechercher', () => {
      if (!st.running) return toast('Démarrez d’abord le nœud.');
      if (!q.value.trim()) return;
      if (!st.peers.length) return toast('Aucun voisin connecté.');
      const id = d.id + '-' + Date.now() + '-' + Math.floor(Math.random() * 1e4);
      st.seen.add(id); st.route[id] = 'me'; st.hits = [];
      st.peers.forEach(p => send(p, { t: 'q', id, q: q.value.trim(), ttl: 5 }));
      slog(d, 'p2p', 'Recherche « ' + q.value.trim() + ' » envoyée'); drawHits();
    })), hits, h('div', { class: 'lbl' }, 'Journal'), logB));
  return () => { delete d.rt.ui.p2p; };
}
/* ===== Démarrage ===== */
Sim.notify = () => { render(); refreshers.forEach(f => { try { f(); } catch (e) { /* fenêtre fermée */ } }); };
(function boot() {
  let loaded = false;
  try { const t = localStorage.getItem('simulateur-reseau-v1'); if (t) { loadState(t); loaded = true; } } catch (e) { /* stockage indisponible ou schéma illisible */ }
  if (!loaded) loadEmpty();
  buildToolbar();
  renderProps();
})();
</script>
</body>
